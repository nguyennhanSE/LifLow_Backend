  postgres:
    image: postgres
    container_name: postgres
    env_file:
      - .env.prod 
    environment:
      # IMPORTANT:
      # - `${...}` here is resolved by Docker Compose *before* containers start.
      # - `env_file: .env.dev` does NOT populate those `${...}` values for Compose interpolation.
      #   (it only injects env into the container once it starts).
      # So we provide defaults to prevent Postgres from exiting when variables are missing.
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123456}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      PGDATA: /data/postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - liflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis: 
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - liflow-network
    # Ubuntu/EC2 optimizations
    # sysctls:
    #   - net.core.somaxconn=65535
    # ulimits:
    #   memlock: -1
    # environment:
    #   - REDIS_REPLICATION_MODE=master

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - liflow-network
    pid: host                          # Xem processes của host
    volumes:
      - /proc:/host/proc:ro            # CPU, RAM, processes
      - /sys:/host/sys:ro              # Hardware info
      - /:/rootfs:ro                   # Filesystem
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - liflow-network
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - liflow-network

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540" 
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data
    networks:
      - liflow-network
      
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: backup
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - backup_data:/backups
    environment:
      # Use Docker service name for postgres connection
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DATABASE_NAME:-postgres}
      - POSTGRES_USER=${POSTGRES_BACKUP_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_BACKUP_USER_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - EXTRA_OPTS=--schema=public
    networks:
      - liflow-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - liflow-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liflow-network
    
networks:
  liflow-network:
    driver: bridge

volumes:
  postgres:
  redis_data:
  prometheus_data:
  grafana_data:
  redisinsight_data:
  backup_data:
  elasticsearch_data:
  kibana_data:


