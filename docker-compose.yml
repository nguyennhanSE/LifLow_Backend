  postgres:
    image: postgres
    container_name: postgres
    env_file:
      - .env.prod 
    environment:
      # IMPORTANT:
      # - `${...}` here is resolved by Docker Compose *before* containers start.
      # - `env_file: .env.dev` does NOT populate those `${...}` values for Compose interpolation.
      #   (it only injects env into the container once it starts).
      # So we provide defaults to prevent Postgres from exiting when variables are missing.
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-123456}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5433:5432"
    networks:
      - liflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis: 
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - liflow-network
    # Ubuntu/EC2 optimizations
    # sysctls:
    #   - net.core.somaxconn=65535
    # ulimits:
    #   memlock: -1
    # environment:
    #   - REDIS_REPLICATION_MODE=master

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - liflow-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - liflow-network
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - liflow-network

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540" 
    restart: unless-stopped
    networks:
      - liflow-network
      
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: backup
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    environment:
      # Use Docker service name for postgres connection
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DATABASE_NAME:-postgres}
      - POSTGRES_USER=${POSTGRES_BACKUP_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_BACKUP_USER_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - EXTRA_OPTS=--schema=public
    networks:
      - liflow-network
    
networks:
  liflow-network:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  redis_data:


